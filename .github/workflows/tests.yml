name: tests

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q   # fake LLM, no Ollama or API keys needed
