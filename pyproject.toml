[project]
name = "lorekeeper"
version = "0.1.0"
description = "A LangGraph RAG agent that guards the archives of a fictional world, with an eval set and a quiz duel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-ollama>=0.2",
    "langchain-groq>=0.2",
    "langchain-chroma>=0.1",
    "chromadb>=0.5",
    "fastembed>=0.4",
    "rank-bm25>=0.2.2",
    "streamlit>=1.38",
    "pandas>=2.0",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lorekeeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
